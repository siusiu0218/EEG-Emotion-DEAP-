<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>数据术语速查</title><link rel="stylesheet" href="../assets/lesson.css"></head><body><h1>数据术语速查</h1><p><strong>受试者：</strong>参与实验的人；本项目一个 sXX.dat 对应一人。</p><p><strong>试验：</strong>一次观看视频及对应信号记录；每名受试者有 40 次。</p><p><strong>通道：</strong>一条测量信号；当前选用前 32 个 EEG 通道。</p><p><strong>采样点：</strong>信号在某个时刻的数值；当前采样率为每秒 128 点。</p><p><strong>shape：</strong>数组各维度的大小；本课顺序为试验、通道、采样点。</p><p><a href="../lessons/0001-read-subject-data.html">返回第一课</a> · <a href="../docs/REPRODUCTION_PROTOCOL.md">本地来源</a></p></body></html>
